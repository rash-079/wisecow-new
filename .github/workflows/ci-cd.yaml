name: CI/CD Pipeline for Wisecow App

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v2
        
      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Log in to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t rashmi1408/wisecow:$GITHUB_SHA .
          docker push rashmi1408/wisecow:$GITHUB_SHA

      # Step 5: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Step 6: Configure gcloud CLI
      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
          location: us-east1-b
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 7: Deploy to GKE
      - name: Deploy to GKE
        run: |
          kubectl set image deployment/wisecow-deployment wisecow-app=rashmi1408/wisecow:$GITHUB_SHA
          kubectl rollout status deployment/wisecow-deployment